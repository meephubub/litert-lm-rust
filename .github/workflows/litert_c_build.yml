name: Build LiteRT-LM Windows
on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout LiteRT-LM
        uses: actions/checkout@v4
        with:
          repository: google-ai-edge/LiteRT-LM

      - name: Setup Bazelisk
        uses: bazelbuild/setup-bazelisk@v3

      - name: Remove Android Toolchain Declarations
        shell: powershell
        run: |
          $path = "WORKSPACE"
          Write-Host "Removing Android declarations from $path..."
          $text = Get-Content $path -Raw

          # Comment out android_ndk_repository and android_sdk_repository
          $text = $text -replace '(?s)android_ndk_repository\s*\([^)]*\)', '# android_ndk_repository disabled'
          $text = $text -replace '(?s)android_sdk_repository\s*\([^)]*\)', '# android_sdk_repository disabled'

          # Comment out register_toolchains call referencing @androidndk
          $text = $text -replace '(?m)^(.*register_toolchains\(.*androidndk.*)$', '# $1'

          Set-Content $path $text
          Write-Host "Verifying WORKSPACE edits:"
          Select-String -Path $path -Pattern "android"

      - name: Build LiteRT-LM C API
        shell: powershell
        run: |
          # Enforce Windows host compilation and clear extra toolchains
          bazelisk build //c:litert-lm `
            --config=windows `
            --build_tag_filters=-android `
            --extra_toolchains= `
            --verbose_failures `
            --sandbox_debug `
            --keep_going

      - name: Locate build output
        shell: powershell
        run: |
          Write-Host "Searching bazel-bin..."
          Get-ChildItem `
            -Recurse `
            bazel-bin `
            -Include *.dll,*.lib `
            -ErrorAction SilentlyContinue

      - name: Collect binaries
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path output
          Copy-Item `
            bazel-bin\c\*.dll `
            output\ `
            -ErrorAction SilentlyContinue
          Copy-Item `
            bazel-bin\c\*.lib `
            output\ `
            -ErrorAction SilentlyContinue
          # LiteRT runtime dependencies
          Copy-Item `
            prebuilt\windows_x86_64\*.dll `
            output\ `
            -ErrorAction SilentlyContinue
          Write-Host "Final files:"
          Get-ChildItem output

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: litert-lm-windows-x86_64
          path: output
