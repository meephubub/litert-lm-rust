name: Build LiteRT-LM Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout LiteRT-LM
        uses: actions/checkout@v4
        with:
          repository: google-ai-edge/LiteRT-LM

      - name: Setup Bazelisk
        uses: bazelbuild/setup-bazelisk@v3

      - name: Enable Long Paths on Windows Host
        shell: powershell
        run: |
          New-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' `
            -Name 'LongPathsEnabled' `
            -Value 1 `
            -PropertyType DWORD `
            -Force

      - name: Patch Bazel files
        shell: powershell
        run: |
          Write-Host "Patching Bazel files recursively..."

          $files = Get-ChildItem -Recurse -File |
            Where-Object {
              $_.Name -match '^WORKSPACE(\.bazel)?$' -or
              $_.Extension -eq '.bzl'
            }

          foreach ($file in $files) {
            Write-Host "Patching $($file.FullName)"

            $text = Get-Content $file.FullName -Raw

            # Disable Android repositories
            $text = $text -replace '(?s)android_ndk_repository\s*\([^)]*\)', '# android_ndk_repository disabled'
            $text = $text -replace '(?s)android_sdk_repository\s*\([^)]*\)', '# android_sdk_repository disabled'

            # Disable Android toolchain registration lines
            $text = $text -replace '(?m)^.*register_toolchains\(.*androidndk.*$', '# android toolchains disabled'

            # Remove all sha256 attributes
            $text = $text -replace '(?m)^\s*sha256\s*=\s*"[^"]*",?\r?\n', ''

            # Patch minizip source URL
            $text = $text -replace `
              'url\s*=\s*"https://zlib\.net/fossils/zlib-1\.3\.1\.tar\.gz"', `
              'url = "https://codeload.github.com/madler/zlib/tar.gz/refs/tags/v1.3.1"'

            # Patch GitHub archive strip prefix
            $text = $text -replace `
              'strip_prefix\s*=\s*"zlib-1\.3\.1/contrib/minizip"', `
              'strip_prefix = "zlib-1.3.1/contrib/minizip"'

            Set-Content -Path $file.FullName -Value $text
          }

      - name: Verify checksum removal
        shell: powershell
        run: |
          $matches = Get-ChildItem -Recurse -File |
            Where-Object {
              $_.Name -match '^WORKSPACE(\.bazel)?$' -or
              $_.Extension -eq '.bzl'
            } |
            Select-String 'sha256\s*='

          if ($matches) {
            Write-Host "Remaining sha256 lines:"
            $matches
          } else {
            Write-Host "No sha256 lines remain in repository Bazel files."
          }

      - name: Build LiteRT-LM C API
        shell: powershell
        run: |
          bazelisk --output_user_root=C:\b build //c:litert-lm `
            --config=windows `
            --build_tag_filters=-android `
            --extra_toolchains= `
            --jobs=2 `
            --local_ram_resources=6144 `
            --verbose_failures `
            --sandbox_debug `
            --keep_going

      - name: Locate build output
        shell: powershell
        run: |
          Write-Host "Searching bazel-bin..."
          Get-ChildItem `
            -Recurse `
            bazel-bin `
            -Include *.dll,*.lib `
            -ErrorAction SilentlyContinue

      - name: Collect binaries
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path output

          Copy-Item `
            bazel-bin\c\*.dll `
            output\ `
            -ErrorAction SilentlyContinue

          Copy-Item `
            bazel-bin\c\*.lib `
            output\ `
            -ErrorAction SilentlyContinue

          # LiteRT runtime dependencies
          Copy-Item `
            prebuilt\windows_x86_64\*.dll `
            output\ `
            -ErrorAction SilentlyContinue

          Write-Host "Final files:"
          Get-ChildItem output

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: litert-lm-windows-x86_64
          path: output
