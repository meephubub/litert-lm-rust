name: Build LiteRT-LM Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Enable Windows Long Paths
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name 'LongPathsEnabled' -Value 1
          git config --system core.longpaths true

      - name: Checkout LiteRT-LM
        uses: actions/checkout@v4
        with:
          repository: google-ai-edge/LiteRT-LM

      - name: Setup Bazelisk
        uses: bazelbuild/setup-bazelisk@v3

      - name: Verify Build Environment
        shell: powershell
        run: |
          Write-Host "=== Versions ==="
          bazelisk version
          rustc --version
          cargo --version

          Write-Host ""
          Write-Host "=== Tool Locations ==="
          where.exe bazelisk
          where.exe rustc
          where.exe cargo
          where.exe cl
          where.exe link

      - name: Patch WORKSPACE Dependencies
        shell: powershell
        run: |
          $path = "WORKSPACE"

          Write-Host "Patching WORKSPACE..."
          $text = Get-Content $path -Raw

          # Disable Android repositories
          $text = $text -replace '(?s)android_ndk_repository\s*\([^)]*\)', '# android_ndk_repository disabled'
          $text = $text -replace '(?s)android_sdk_repository\s*\([^)]*\)', '# android_sdk_repository disabled'

          # Disable Android toolchain registration
          $text = $text -replace '(?m)^(.*register_toolchains\(.*androidndk.*)$', '# $1'

          # Remove ALL sha256 fields
          $text = $text -replace '(?m)^\s*sha256\s*=\s*"[^"]*",?\r?\n', ''

          Set-Content $path $text

          Write-Host ""
          Write-Host "Remaining sha256 entries:"
          Select-String -Path $path -Pattern "sha256"

      - name: Build LiteRT-LM C API
        shell: powershell
        run: |
          bazelisk `
            --output_user_root=C:\b `
            build //c:litert-lm `
            --config=windows `
            --build_tag_filters=-android `
            --extra_toolchains= `
            --verbose_failures `
            --subcommands `
            --sandbox_debug `
            --keep_going `
            --announce_rc `
            --experimental_ui_debug_all_events

      - name: Dump Bazel Logs
        if: failure()
        shell: powershell
        run: |
          Write-Host "========== Searching Bazel Output =========="

          if (Test-Path "bazel-out") {
            Get-ChildItem bazel-out -Recurse -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Extension -match "log|txt|stderr|stdout"
              } |
              ForEach-Object {
                Write-Host ""
                Write-Host "===== $($_.FullName) ====="
                Get-Content $_.FullName -ErrorAction SilentlyContinue
              }
          }

      - name: Search for Missing Rust Object
        if: failure()
        shell: powershell
        run: |
          Write-Host "Searching for generated object files..."

          Get-ChildItem C:\b -Recurse -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -like "*cargo_toml_variable_extractor*"
            } |
            Select-Object FullName

      - name: Locate Build Output
        shell: powershell
        run: |
          Write-Host "Searching bazel-bin..."

          Get-ChildItem `
            -Recurse `
            bazel-bin `
            -Include *.dll,*.lib `
            -ErrorAction SilentlyContinue

      - name: Collect Binaries
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path output

          Copy-Item `
            bazel-bin\c\*.dll `
            output\ `
            -ErrorAction SilentlyContinue

          Copy-Item `
            bazel-bin\c\*.lib `
            output\ `
            -ErrorAction SilentlyContinue

          Copy-Item `
            prebuilt\windows_x86_64\*.dll `
            output\ `
            -ErrorAction SilentlyContinue

          Write-Host "Collected files:"
          Get-ChildItem output

      - name: Upload Windows Binaries
        uses: actions/upload-artifact@v4
        with:
          name: litert-lm-windows-x86_64
          path: output
