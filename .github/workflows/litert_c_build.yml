name: Build LiteRT-LM Windows
on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout LiteRT-LM
        uses: actions/checkout@v4
        with:
          repository: google-ai-edge/LiteRT-LM

      - name: Setup Bazelisk
        uses: bazelbuild/setup-bazelisk@v3

      - name: Enable Long Paths on Windows Host
        shell: powershell
        run: |
          New-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' `
            -Name 'LongPathsEnabled' `
            -Value 1 `
            -PropertyType DWORD `
            -Force

      - name: Patch WORKSPACE Dependencies
        shell: powershell
        run: |
          $path = "WORKSPACE"
          Write-Host "Patching WORKSPACE file..."
          $text = Get-Content $path -Raw

          # 1. Comment out android_ndk_repository and android_sdk_repository
          $text = $text -replace '(?s)android_ndk_repository\s*\([^)]*\)', '# android_ndk_repository disabled'
          $text = $text -replace '(?s)android_sdk_repository\s*\([^)]*\)', '# android_sdk_repository disabled'

          # 2. Comment out register_toolchains call referencing @androidndk
          $text = $text -replace '(?m)^(.*register_toolchains\(.*androidndk.*)$', '# $1'

          # 3. Fix broken minizip source URL and checksum
          $oldUrl = 'https://zlib.net/fossils/zlib-1.3.1.tar.gz'
          $newUrl = 'https://github.com/madler/zlib/archive/refs/tags/v1.3.1.tar.gz'
          $text = $text.Replace($oldUrl, $newUrl)

          $oldHash = '9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23'
          $newHash = '70732b9292357945d7a644265551982b6c934f07a6839e55938bfb646014e365'
          $text = $text.Replace($oldHash, $newHash)

          Set-Content -Path $path -Value $text

          Write-Host "Verifying minizip patch state:"
          Select-String -Path $path -Pattern "madler/zlib"

      - name: Build LiteRT-LM C API
        shell: powershell
        run: |
          # Use short output user root (C:\b) to prevent Rust LNK1181 path truncation errors
          bazelisk --output_user_root=C:\b build //c:litert-lm `
            --config=windows `
            --build_tag_filters=-android `
            --extra_toolchains= `
            --features=compiler_param_file `
            --features=archive_param_file `
            --jobs=2 `
            --local_ram_resources=6144 `
            --verbose_failures `
            --sandbox_debug `
            --keep_going

      - name: Locate build output
        shell: powershell
        run: |
          Write-Host "Searching bazel-bin..."
          Get-ChildItem `
            -Recurse `
            bazel-bin `
            -Include *.dll,*.lib `
            -ErrorAction SilentlyContinue

      - name: Collect binaries
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path output
          Copy-Item `
            bazel-bin\c\*.dll `
            output\ `
            -ErrorAction SilentlyContinue
          Copy-Item `
            bazel-bin\c\*.lib `
            output\ `
            -ErrorAction SilentlyContinue
          # LiteRT runtime dependencies
          Copy-Item `
            prebuilt\windows_x86_64\*.dll `
            output\ `
            -ErrorAction SilentlyContinue
          Write-Host "Final files:"
          Get-ChildItem output

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: litert-lm-windows-x86_64
          path: output
